<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SN1 - Monthly Count</title>

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

  <div class="main-content">

    <div class="topbar">

      <div class="menu-btn">
        <i class="fa-solid fa-bars"></i>
      </div>

      <div class="top-right">
        <i class="fa-regular fa-bell"></i>
      </div>

    </div>


    <main class="monthly-count-page">

      <h1>
        <i class="fa-solid fa-calendar-days"></i>
        Monthly Count
      </h1>

      <p>
        ស្កេនម៉ាស៊ីនសម្រាប់ការរាប់ប្រចាំខែ
      </p>


      <!-- Scanner Section -->
      <section class="count-card">

        <h2>
          ស្កេនម៉ាស៊ីន
        </h2>

        <button class="scan-btn">
          <i class="fa-solid fa-camera"></i>
          បើក Camera
        </button>


        <!-- Scanned List will be added here later -->

      </section>


    </main>

  </div>

</body>
</html>
