<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SN1 - Monthly Count</title>

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/monthly-count.css">

  <link
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap"
  rel="stylesheet">
  
</head>
  
  <body>

  <div class="main-content">

    <div class="topbar">

      <div class="menu-btn" onclick="toggleSidebar()">
        <i class="fa-solid fa-bars"></i>
      </div>

      <div class="top-right">
        <i class="fa-regular fa-bell"></i>
      </div>

    </div>


    <main class="monthly-count-page">

      <h1>
        <i class="fa-solid fa-calendar-days"></i>
        Monthly Count
      </h1>

      <p>
        ស្កេនម៉ាស៊ីនសម្រាប់ការរាប់ប្រចាំខែ
      </p>


      <!-- Scanner Section -->
      <section class="count-card">

        <h2>
          ស្កេនម៉ាស៊ីន
        </h2>

        <button class="scan-btn" onclick="alert('Camera button works!'); startMonthlyScanner();">
          <i class="fa-solid fa-camera"></i>
          បើក Camera
        </button>
        <div id="scannerArea" style="display: none;"></div>

  <!-- MONTHLY COUNT CONTROL -->

<div class="count-controls">

    <div class="control-group">
        <label for="countMonth">
            <i class="fa-solid fa-calendar"></i>
            ជ្រើសរើសខែ និងឆ្នាំ
        </label>

        <select id="countMonth">
            <option value="">ជ្រើសរើសខែ និងឆ្នាំ</option>
        </select>
    </div>


    <div class="count-dates">

        <div class="control-group">
            <label for="countDate1">
                ថ្ងៃរាប់ទី 1
            </label>

            <input type="date" id="countDate1">
        </div>


        <div class="control-group">
            <label for="countDate2">
                ថ្ងៃរាប់ទី 2
            </label>

            <input type="date" id="countDate2">
        </div>

    </div>

</div>


<!-- MONTHLY SUMMARY -->

<div class="monthly-summary">

    <h2>
        <i class="fa-solid fa-chart-simple"></i>
        សរុបតាមប្រភេទ
    </h2>

    <div id="categorySummary">
        <!-- Category counts will appear here -->
    </div>

    <div class="total-count">
        <span>សរុបម៉ាស៊ីន</span>
        <strong id="totalCount">0</strong>
    </div>

</div>


<!-- SCANNED MACHINE IDS -->

<div class="scanned-machines">

    <div class="scanned-header">

        <h2>
            <i class="fa-solid fa-list-check"></i>
            ម៉ាស៊ីនដែលបានស្កេន
        </h2>

        <span id="scannedCount">0</span>

    </div>


    <div class="search-machine">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
            type="search"
            id="machineSearch"
            placeholder="ស្វែងរកលេខ ID ម៉ាស៊ីន..."
        >

    </div>


    <div id="scannedMachineList">
        <!-- Scanned machine IDs will appear here -->
    </div>

</div>        

      </section>


    </main>

  </div>
<script src="js/dashboard.js"></script>
<script src="https://unpkg.com/html5-qrcode" type=text/javascript"></script>
<script src="js/monthly-count.js"></script>

</body>
</html>
