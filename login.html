<!DOCTYPE html>
<html lang="km">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SN1 Warehouse</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet" href="css/login.css">
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Kantumruy Pro',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(rgba(8,20,45,.70),
rgba(8,20,45,.75)),
url("images/background.jpg");

background-size:cover;

background-position:center;

background-repeat:no-repeat;

overflow:hidden;

}

.login-box{

width:430px;

padding:40px;

border-radius:25px;

background:rgba(255,255,255,.06);

backdrop-filter: none;

-webkit-backdrop-filter: none;

border:1px solid rgba(255,255,255,.18);

box-shadow:0 20px 60px rgba(0,0,0,.45);

animation:fade .8s;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(35px);

}

to{

opacity:1;

transform:translateY(0);

}

}

.logo{

text-align:center;

margin-bottom:30px;

}

.logo h1{

font-size:62px;

font-weight:700;

color:#fff;

letter-spacing:2px;

}

.logo h2{

margin-top:-5px;

font-size:34px;

color:white;

font-weight:700;

}

.logo p{

margin-top:8px;

color:#dbe8ff;

font-size:17px;

}

.title{

margin-bottom:25px;

text-align:center;

}

.title h3{

color:white;

font-size:32px;

margin-bottom:8px;

}

.title span{

color:#7db7ff;

font-size:18px;

}

.input-group{

position:relative;

margin-top:18px;

}

.input-group i:first-child{

position:absolute;

left:18px;

top:18px;

color:#d8d8d8;

font-size:18px;

}

.input-group input{

width:100%;

height:58px;

padding-left:55px;

padding-right:55px;

border-radius:14px;

border:1px solid rgba(255,255,255,.18);

background:rgba(255,255,255,.08);

color:white;

font-size:18px;

outline:none;

transition:.25s;

}

.input-group input::placeholder{

color:#d8d8d8;

}

.input-group input:focus{

border:1px solid #4da3ff;

box-shadow:0 0 15px rgba(77,163,255,.45);

}

.eye{

position:absolute;

right:18px;

top:18px;

cursor:pointer;

color:#d8d8d8;

font-size:18px;

}

button{

margin-top:28px;

width:100%;

height:58px;

border:none;

border-radius:15px;

background:linear-gradient(90deg,#0b63ff,#2b8dff);

color:white;

font-size:22px;

font-weight:bold;

cursor:pointer;

transition:.25s;

}

button:hover{

transform:translateY(-2px);

box-shadow:0 15px 35px rgba(0,102,255,.45);

}

#msg{

margin-top:18px;

text-align:center;

font-size:17px;

font-weight:600;

}

.footer{

margin-top:28px;

text-align:center;

color:#ddd;

font-size:15px;

}

@media(max-width:480px){

.login-box{

width:92%;

padding:28px;

}

.logo h1{

font-size:48px;

}

.logo h2{

font-size:28px;

}

}

</style>

</head>
<body>

<div class="login-box">

<div class="logo">

<h1>SN1</h1>

<h2>ប្រព័ន្ធគ្រប់គ្រង</h2>

<p>Warehouse Management System</p>

</div>

<div class="title">

<h3>សូមស្វាគមន៍</h3>

<span>ចូលប្រើប្រព័ន្ធគ្រប់គ្រង SN1</span>

</div>

<div class="input-group">

<i class="fa-regular fa-user"></i>

<input
type="text"
id="user"
placeholder="លេខអ្នកប្រើ">

</div>

<div class="input-group">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="pass"
placeholder="លេខសម្ងាត់">

<i
class="fa-regular fa-eye eye"
id="togglePassword">
</i>

</div>

<button onclick="login()">

ចូលប្រើប្រាស់
&nbsp;
<i class="fa-solid fa-arrow-right"></i>

</button>

<div id="msg"></div>

<div class="footer">

© 2025 SN1. All rights reserved.

</div>

</div>
<script>

const toggle=document.getElementById("togglePassword");

const password=document.getElementById("pass");

toggle.onclick=function(){

if(password.type==="password"){

password.type="text";

toggle.classList.remove("fa-eye");

toggle.classList.add("fa-eye-slash");

}else{

password.type="password";

toggle.classList.remove("fa-eye-slash");

toggle.classList.add("fa-eye");

}
}
async function login(){

const username=document.getElementById("user").value;
const password=document.getElementById("pass").value;

const form=new FormData();

form.append("action","login");
form.append("username",username);
form.append("password",password);
  
try{
  
const res=await fetch("/api", {

method:"POST",

body:form

});

const data=await res.json();

document.getElementById("msg").innerHTML=data.message;

if(data.success){

localStorage.setItem("SN1User",data.user);

window.location.href="index.html";

}

} catch (error) {
  alert("LOGIN ERROR: " + error.message);
  }
}
</script>
  
<script src="js/login.js"></script>

<script>
  const angkorImages = [
    "images/Angkor1.png",
    "images/Angkor2.png",
    "images/Angkor3.png",
    "images/Angkor4.png",
    "images/Angkor5.png",
    "images/Angkor6.png",
    "images/Angkor7.png",
    "images/Angkor8.png",
    "images/Angkor9.png",
    "images/Angkor10.png"
  ];

  const randomImage =
    angkorImages[Math.floor(Math.random() * angkorImages.length)];

  document.body.style.backgroundImage =
    'linear-gradient(rgba(8,20,45,.70), rgba(8,20,45,.75)), url("' + randomImage + '")';
</script>  
</body>

</html>
