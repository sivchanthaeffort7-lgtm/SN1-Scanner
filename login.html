<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SN1 Login</title>

<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Kantumruy Pro',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:

linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),

url("https://images.unsplash.com/photo-1517048676732-d65bc937f952?auto=format&fit=crop&w=1800&q=80");

background-size:cover;

background-position:center;

}

.login{

width:420px;

padding:45px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(18px);

border-radius:18px;

box-shadow:0 10px 40px rgba(0,0,0,.35);

color:white;

text-align:center;

}

.logo{

font-size:55px;

margin-bottom:10px;

}

h2{

margin-bottom:30px;

}

input{

width:100%;

padding:16px;

margin-bottom:18px;

border:none;

border-radius:10px;

font-size:17px;

}

button{

width:100%;

padding:16px;

background:#1565c0;

color:white;

font-size:18px;

border:none;

border-radius:10px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#0d47a1;

}

</style>

</head>

<body>

<div class="login">

<div class="logo">📦</div>

<h2>ប្រព័ន្ធគ្រប់គ្រង SN1</h2>

<input
type="text"
placeholder="ឈ្មោះអ្នកប្រើ">

<input
type="password"
placeholder="លេខសម្ងាត់">

<button>
ចូលប្រើប្រាស់
</button>

</div>

</body>
</html>
