<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Report - SN1</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Khmer", sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .page {
      min-height: 100vh;
      padding: 30px;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
    }

    .header {
      background: #0645ad;
      color: white;
      padding: 28px 30px;
      border-radius: 18px 18px 0 0;
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      opacity: 0.9;
      font-size: 14px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 0 0 18px 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .section-title {
      font-size: 19px;
      font-weight: bold;
      color: #0645ad;
      margin-bottom: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #374151;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .auto-info {
      background: #f1f5ff;
      border: 1px solid #dbe7ff;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 25px;
    }

    .auto-info strong {
      color: #0645ad;
    }

    .buttons {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 28px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 25px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .reset-btn {
      background: #e5e7eb;
      color: #374151;
    }

    .submit-btn {
      background: #0645ad;
      color: white;
      min-width: 150px;
    }

    .submit-btn:hover {
      background: #04388d;
    }

    .status {
      margin-top: 20px;
      padding: 13px 15px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
    }

    .status.success {
      display: block;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    .status.error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

 /* ==========================================
   RECENT REPORTS — LAST 3 DAYS
   ========================================== */

.recent-reports {
  background: white;
  padding: 30px;
  margin-top: 20px;
  border-radius: 18px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

.recent-reports .section-title {
  margin-bottom: 18px;
}

.recent-report-card {
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 14px;
  background: #fafbff;
}

.recent-report-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.recent-report-date {
  font-weight: bold;
  color: #0645ad;
}

.recent-report-action {
  padding: 5px 10px;
  border-radius: 8px;
  background: #eef4ff;
  color: #0645ad;
  font-size: 13px;
  font-weight: bold;
}

.recent-report-machines {
  white-space: pre-line;
  line-height: 1.7;
  color: #374151;
  font-weight: 500;
}

.recent-report-info {
  margin-top: 10px;
  font-size: 13px;
  color: #6b7280;
}

.recent-report-empty {
  text-align: center;
  padding: 25px;
  color: #6b7280;
}    
    @media (max-width: 700px) {
      .page {
        padding: 15px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .card {
        padding: 20px;
      }

      .buttons {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="container">

      <div class="header">
        <h1>របាយការណ៍</h1>
        <p>SN1 Warehouse Management System</p>
      </div>

      <div class="card">

        <div class="section-title">
          បញ្ចូលព័ត៌មាននៃការផ្លាស់ទីរបស់ម៉ាស៊ីន
        </div>

        <div class="auto-info">
          <div>
            <strong>ថ្ងៃ / ម៉ោង:</strong>
            <span id="currentDateTime">--</span>
          </div>

          <div style="margin-top:6px;">
            <strong>អ្នកបញ្ចូល:</strong>
            <span id="currentUser">SN1 User</span>
          </div>
        </div>

        <form id="reportForm">

          <div class="grid">

            <!-- Machine IDs -->
<div class="field full">
  <label for="machineIds">
    លេខសម្គាល់ម៉ាស៊ីន
  </label>

  <textarea
    id="machineIds"
    name="machineIds"
    placeholder="បញ្ចូលលេខសម្គាល់ម៉ាស៊ីនមួយក្នុងមួយបន្ទាត់&#10;ឧ.&#10;SN1-0001&#10;SN1-0002&#10;SN1-0003"
    required
  ></textarea>

  <small id="machineCount" style="margin-top:7px; color:#6b7280;">
    0 / 20 ម៉ាស៊ីន
  </small>
</div>
            <!-- Action -->
            <div class="field">
              <label for="action">
                Action
              </label>

              <select
                id="action"
                name="action"
                required
              >
                <option value="">-- ជ្រើសរើស --</option>
                <option value="ជួល">ជួល</option>
                <option value="ដកត្រឡប់">ដកត្រឡប់</option>
                <option value="ប្ដូរចេញ">ប្ដូរចេញ</option>
                <option value="ប្ដូរចូល">ប្ដូរចូល</option>
                <option value="លក់ចេញ">លក់ចេញ</option>
                <option value="ជួសជុល">ជួសជុល</option>
              </select>
            </div>

            <!-- From -->
            <div class="field">
              <label for="from">
                From
              </label>

              <input
                type="text"
                id="from"
                name="from"
                placeholder="ទីតាំងចេញ"
              >
            </div>

            <!-- To -->
            <div class="field">
              <label for="to">
                To
              </label>

              <input
                type="text"
                id="to"
                name="to"
                placeholder="ទីតាំងទៅ"
              >
            </div>

            <!-- Customer -->
            <div class="field">
              <label for="customer">
                Customer
              </label>

              <input
                type="text"
                id="customer"
                name="customer"
                placeholder="ឈ្មោះអតិថិជន"
              >
            </div>

            <!-- Reference -->
            <div class="field">
              <label for="reference">
                Reference
              </label>

              <input
                type="text"
                id="reference"
                name="reference"
                placeholder="ឧ. SN-15-0067"
              >
            </div>

            <!-- By -->
            <div class="field">
              <label for="by">
                By
              </label>

              <input
                type="text"
                id="by"
                name="by"
                placeholder="អ្នកធ្វើរបាយការណ៍"
              >
            </div>

            <!-- Remark -->
            <div class="field full">
              <label for="remark">
                Remark
              </label>

              <textarea
                id="remark"
                name="remark"
                placeholder="បញ្ចូលកំណត់សម្គាល់..."
              ></textarea>
            </div>

          </div>

          <div class="buttons">

            <button
              type="button"
              class="reset-btn"
              onclick="resetReportForm()"
            >
              សម្អាត
            </button>

            <button
              type="submit"
              class="submit-btn"
            >
              បញ្ចូលរបាយការណ៍
            </button>

          </div>

        </form>

        <div id="status" class="status"></div>

      </div>

<!-- ==========================================
     RECENT REPORTS — LAST 3 DAYS
     ========================================== -->

<div class="recent-reports">

  <div class="section-title">
    របាយការណ៍ 3 ថ្ងៃចុងក្រោយ
  </div>

  <div id="recentReportsContent">

    <div style="
      text-align:center;
      padding:20px;
      color:#6b7280;
    ">
      កំពុងទាញទិន្នន័យ...
    </div>

  </div>

</div>      
    </div>

  </div>


  <script>

    // ==============================
    // CURRENT DATE & TIME
    // ==============================

    function updateDateTime() {

      const now = new Date();

      const date = now.toLocaleDateString(
        "en-GB",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }
      );

      const time = now.toLocaleTimeString(
        "en-GB",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

      document.getElementById(
        "currentDateTime"
      ).textContent = date + " " + time;
    }


    updateDateTime();

    setInterval(updateDateTime, 1000);


    // ==========================================
// SUBMIT REPORT → SN1 DASHBOARD API
// ==========================================

const REPORT_API_URL =
  "https://script.google.com/macros/s/AKfycbygz-LJGLKQ7RiBcDiHVMyi7SLeGSO9cmNoozRSSP_egC1_EApPzfUTBePkB-Cd5gij9Q/exec";


document
  .getElementById("reportForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const status =
      document.getElementById("status");

    const machineIds =
      document.getElementById("machineIds").value
        .split("\n")
        .map(id => id.trim().toUpperCase())
        .filter(id => id !== "");

    // ==========================================
    // VALIDATE MACHINE COUNT
    // ==========================================

    if (machineIds.length === 0) {

      status.className = "status error";

      status.textContent =
        "សូមបញ្ចូលលេខសម្គាល់ម៉ាស៊ីនយ៉ាងហោចណាស់ 1 គ្រឿង។";

      return;
    }

    if (machineIds.length > 20) {

      status.className = "status error";

      status.textContent =
        "អាចបញ្ចូលបានអតិបរមា 20 ម៉ាស៊ីនក្នុងមួយរបាយការណ៍។";

      return;
    }


    // ==========================================
    // COLLECT FORM DATA
    // ==========================================

    const data = {

      machineIds: machineIds,

      action:
        document.getElementById("action").value.trim(),

      from:
        document.getElementById("from").value.trim(),

      to:
        document.getElementById("to").value.trim(),

      customer:
        document.getElementById("customer").value.trim(),

      reference:
        document.getElementById("reference").value.trim(),

      by:
        document.getElementById("by").value.trim(),

      remark:
        document.getElementById("remark").value.trim()

    };


    // ==========================================
    // SHOW SAVING STATUS
    // ==========================================

    status.className = "status";

    status.style.display = "block";

    status.textContent =
      "កំពុងបញ្ចូលរបាយការណ៍...";


    // ==========================================
    // SEND TO GOOGLE APPS SCRIPT
    // ==========================================

    try {

      const response = await fetch(
        REPORT_API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify(data)
        }
      );


      const result =
        await response.json();


      // ========================================
      // SUCCESS
      // ========================================

      if (result.success) {

        status.className =
          "status success";

        status.textContent =
          "✅ របាយការណ៍បានបញ្ចូលជោគជ័យ! " +
          result.count +
          " ម៉ាស៊ីនបានរក្សាទុកក្នុង Movement_History។";

        document
          .getElementById("reportForm")
          .reset();

        document
          .getElementById("machineCount")
          .textContent =
            "0 / 20 ម៉ាស៊ីន";

      }

      // ========================================
      // ERROR
      // ========================================

      else {

        status.className =
          "status error";

        status.textContent =
          "❌ មិនអាចបញ្ចូលរបាយការណ៍បានទេ: " +
          (result.error ||
           result.message ||
           "Unknown error");

      }

    }

    catch (error) {

      console.error(
        "Report API Error:",
        error
      );

      status.className =
        "status error";

      status.textContent =
        "❌ មិនអាចភ្ជាប់ទៅ SN1 Dashboard API បានទេ។";

    }

});

    // ==============================
    // RESET
    // ==============================

    function resetReportForm() {

      document
        .getElementById("reportForm")
        .reset();

      const status =
        document.getElementById("status");

      status.className = "status";

      status.textContent = "";
    }

// ==============================
// MACHINE ID LIMIT — MAX 20
// ==============================

const machineIdsInput =
  document.getElementById("machineIds");

const machineCount =
  document.getElementById("machineCount");


machineIdsInput.addEventListener("input", function () {

  const lines = this.value
    .split("\n")
    .map(id => id.trim())
    .filter(id => id !== "");

  const count = lines.length;

  machineCount.textContent =
    count + " / 20 ម៉ាស៊ីន";

  if (count > 20) {

    machineCount.style.color = "#b91c1c";

    machineCount.textContent =
      "⚠️ លើសចំនួនកំណត់! អតិបរមា 20 ម៉ាស៊ីន";

  } else {

    machineCount.style.color = "#6b7280";

  }

});    

// ==========================================
// RECENT REPORTS — LAST 3 DAYS
// READ RAW DATA FROM MOVEMENT_HISTORY
// ==========================================

async function loadRecentReports() {

  const container =
    document.getElementById("recentReportsContent");

  if (!container) {
    return;
  }

  container.innerHTML = `
    <div class="recent-report-empty">
      កំពុងផ្ទុករបាយការណ៍...
    </div>
  `;

  try {

    const response = await fetch(
      REPORT_API_URL + "?report=recent"
    );

    const result = await response.json();

    // ========================================
    // CHECK API RESULT
    // ========================================

    if (!result.success) {

      throw new Error(
        result.error ||
        result.message ||
        "Unable to load reports."
      );
    }

    // ========================================
    // GET RAW REPORTS
    // ========================================

    const reports =
      Array.isArray(result.reports)
        ? result.reports
        : [];

    // ========================================
    // NO REPORT
    // ========================================

    if (reports.length === 0) {

      container.innerHTML = `
        <div class="recent-report-empty">
          មិនទាន់មានរបាយការណ៍ក្នុង 3 ថ្ងៃចុងក្រោយទេ។
        </div>
      `;

      return;
    }

    // ========================================
    // CLEAR CONTAINER
    // ========================================

    container.innerHTML = "";

    // ========================================
    // DISPLAY EVERY RAW RECORD
    // ========================================

    reports.forEach(function(report) {

      const card =
        document.createElement("div");

      card.className =
        "recent-report-card";

      // ======================================
      // MACHINE ID
      // ======================================

      const machineId =
        report["Machine ID"] || "-";

      // ======================================
      // DATE + TIME
      // ======================================

      const date =
        report["Date"] || "";

      const time =
        report["Time"] || "";

      // ======================================
      // ACTION
      // ======================================

      const action =
        report["Action"] || "";

      // ======================================
      // OTHER INFORMATION
      // ======================================

      const from =
        report["From"] || "-";

      const to =
        report["To"] || "-";

      const customer =
        report["Customer"] || "-";

      const by =
        report["By"] || "-";

      const reference =
        report["Reference"] || "";

      const remark =
        report["Remark"] || "";

      // ======================================
      // CARD
      // ======================================

      card.innerHTML = `

        <div class="recent-report-header">

          <span class="recent-report-date">
            📅 ${date}
            &nbsp;
            🕐 ${time}
          </span>

          <span class="recent-report-action">
            ${action}
          </span>

        </div>

        <div class="recent-report-machines">
          ${machineId}
        </div>

        <div class="recent-report-info">

          From:
          ${from}

          &nbsp; → &nbsp;

          To:
          ${to}

          <br>

          Customer:
          ${customer}

          <br>

          By:
          ${by}

          ${
            reference
              ? `<br>Reference: ${reference}`
              : ""
          }

          ${
            remark
              ? `<br>Remark: ${remark}`
              : ""
          }

        </div>

      `;

      container.appendChild(card);

    });

  } catch (error) {

    console.error(
      "Recent Reports Error:",
      error
    );

    container.innerHTML = `
      <div class="recent-report-empty">
        ❌ មិនអាចទាញយករបាយការណ៍បានទេ។
      </div>
    `;

  }

}

// ==========================================
// LOAD RECENT REPORTS WHEN PAGE OPENS
// ==========================================

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadRecentReports();

  }
);    
  </script>

</body>
</html>
