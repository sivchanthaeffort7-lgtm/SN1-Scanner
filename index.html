<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ប្រព័ន្ធ SN1</title>

<style>

*{

padding:0;
box-sizing:border-box;
font-family:Battambang,Arial,sans-serif;
}

body{

}

.header{
background:#1565c0;
color:white;
padding:18px;
font-size:28px;
font-weight:bold;
text-align:center;
}

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

padding:30px;

}

.card{

padding:35px;

text-align:center;

font-size:22px;

font-weight:bold;

cursor:pointer;

box-shadow:0 4px 12px rgba(0,0,0,.15);

transition:.25s;

}

.card:hover{

transform:scale(1.04);

background:#1565c0;

color:white;

}

.footer{

margin-top:40px;

text-align:center;

color:#888;

padding:20px;

}

</style>

</head>

<body>

<div class="header">

📦 ប្រព័ន្ធគ្រប់គ្រង SN1

<div class="menu">

🏠<br><br>

</div>

<div class="card">
📷<br><br>

</div>

<div class="card">
📊<br><br>
រាប់ប្រចាំខែ

<div class="card">

</div>

<div class="card">

</html>
